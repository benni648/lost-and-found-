# Deliberately lenient to start: the goal for Phase 0 is a clean run that CI can
# enforce, then ratchet per module (see docs/DEVELOPMENT_PLAN.md, Phase 0/2).
[mypy]
python_version = 3.11
ignore_missing_imports = True
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unused_configs = True
show_error_codes = True
exclude = (?x)(
    ^web/
    | ^data/
    | ^ml/
    | ^\.venv/
    | ^migrations/versions/
  )
